# The Blanson Post — where the site lives
#
# Read by tools/build-articles.pl to write the shareable page for each story
# (a/<slug>/index.html), sitemap.xml, feed.xml and robots.txt. Re-run the build
# after changing anything here:  perl tools/build-articles.pl
#
# base_url  The address the site is served from, ending in a slash. It has to be
#           the full address, not a relative one: Facebook, iMessage, Instagram
#           and Google Classroom all fetch the preview from their own servers,
#           so a link like "../assets/photo.jpg" means nothing to them.
#
#           If the club ever puts a proper domain on it, change this one line
#           and re-run the build.
#
# design    Which of the three designs a shared link opens. Change it the day
#           your teacher picks one, then re-run the build.
#
#           Until then the stories are still readable at their own address
#           without any JavaScript at all, so a wrong guess here costs a reader
#           nothing worse than the wrong-looking page.

base_url = https://blansonpost.github.io/blanson-post/
design   = traditional
